<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="パワプロ2026-2027 栄冠ナインの個人用資料をまとめたページです。">
  <title>EIKAN HUB</title>
  <link rel="stylesheet" href="./assets/site-nav.css">
  <style>
    :root { color-scheme: light; --ink:#17211b; --muted:#5d6961; --paper:#f4f1e8; --line:#d7d2c4; --green:#176b45; --blue:#175f8f; --shadow:0 14px 36px rgb(34 48 39 / 10%); }
    * { box-sizing: border-box; }
    body { margin:0; background:radial-gradient(circle at 8% 0%,rgb(23 107 69 / 12%),transparent 27rem),radial-gradient(circle at 92% 8%,rgb(23 95 143 / 10%),transparent 25rem),var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif; line-height:1.7; }
    main { width:min(980px,calc(100% - 32px)); margin:0 auto; padding:58px 0 72px; }
    .hero { max-width:700px; margin-bottom:34px; }
    .eyebrow { margin:0 0 5px; color:var(--green); font-size:.78rem; font-weight:850; letter-spacing:.14em; }
    h1 { margin:0; font-size:clamp(2rem,7vw,3.8rem); line-height:1.12; letter-spacing:-.045em; }
    .lead { margin:16px 0 0; color:var(--muted); }
    .tools { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
    .tool { display:flex; min-height:220px; flex-direction:column; padding:25px; border:1px solid var(--line); border-radius:22px; background:rgb(255 253 247 / 92%); color:inherit; text-decoration:none; box-shadow:var(--shadow); transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease; }
    .tool:hover { transform:translateY(-3px); border-color:rgb(23 107 69 / 45%); box-shadow:0 18px 42px rgb(34 48 39 / 15%); }
    .tool:focus-visible { outline:4px solid rgb(23 107 69 / 22%); outline-offset:3px; }
    .icon { display:grid; width:48px; height:48px; place-items:center; border-radius:14px; background:#e3f2e9; color:var(--green); font-size:1.5rem; }
    .tool:nth-child(2) .icon { background:#e5f1f8; color:var(--blue); }
    h2 { margin:19px 0 5px; font-size:1.25rem; line-height:1.35; }
    .tool p { margin:0; color:var(--muted); font-size:.92rem; }
    .open { margin-top:auto; padding-top:22px; color:var(--green); font-weight:800; font-size:.86rem; }
    footer { margin-top:30px; color:var(--muted); font-size:.78rem; }
    @media (max-width:640px) { main { width:min(100% - 22px,520px); padding:35px 0 48px; } .hero { margin-bottom:23px; } .tools { grid-template-columns:1fr; gap:12px; } .tool { min-height:174px; padding:20px; border-radius:17px; } .icon { width:42px; height:42px; border-radius:12px; } h2 { margin-top:14px; } .open { padding-top:15px; } }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="資料ナビゲーション">
    <a class="site-brand is-current" href="./">EIKAN HUB</a>
    <div class="site-links"><a href="./calendar/">カレンダー</a><a href="./world-team/">日本代表投手</a></div>
  </nav>
  <main>
    <section class="hero">
      <p class="eyebrow">PAWAPURO 2026–2027</p>
      <h1>EIKAN HUB</h1>
      <p class="lead">プレイ中に確認したい情報を、用途ごとにまとめています。</p>
    </section>
    <section class="tools" aria-label="資料一覧">
      <a class="tool" href="./calendar/">
        <span class="icon" aria-hidden="true">◫</span>
        <h2>育成イベントカレンダー</h2>
        <p>4年目の入学式までに、止まりたい日付と期間を確認。</p>
        <span class="open">カレンダーを開く →</span>
      </a>
      <a class="tool" href="./world-team/">
        <span class="icon" aria-hidden="true">★</span>
        <h2>1年目夏・日本代表投手候補</h2>
        <p>県別リセマラ確率、候補投手、捕手スカウト先を比較。</p>
        <span class="open">候補一覧を開く →</span>
      </a>
    </section>
    <footer>データや検証条件の更新に合わせて随時更新します。</footer>
  </main>
</body>
</html>
